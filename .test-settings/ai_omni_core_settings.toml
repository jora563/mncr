[core]
threads = 6
blocking_threads = 2
log_level = "debug"
record_logs = true
log_dir = "target/tmp"
server_port = 8081
server_worker_count = 2
server_max_blocking_threads = 2
operator_idle_timeout_s = 300
vk_redirect_uri = "https://localhost:8081/vk/callback"
fe_dir = ".test-settings/fe_dir"

[consul]
consul_host = "http://user:password@test.ru:8500"
consul_id = "uzor-aiomni-core-dev"
consul_tags = ["rust", "api", "ai-omni-core"]
current_host = "http://test.ru:8081"

[chat]
apis = ["vk", "telegram"]

[db]
max_connections = 20
min_connections = 4
max_no_log_connections = 2
acquire_timeout_s = 30
max_lifetime_s = 3600
idle_timeout_s = 60
db_host_url = "localhost"
db_name = "ai_omni_test_db_1"
migrations_home = "sql/core/"
fixtures_dir = "pipeline/fixtures/"
user = "aio_core"
pw = "password"

[llm]
host = "http://localhost:8088/"
chat_path = "/chat"

[queue]
ping_period_s = 30
operator_lifetime_s = 600

[queue.db]
max_connections = 4
min_connections = 1
max_no_log_connections = 1
acquire_timeout_s = 30
max_lifetime_s = 3600
idle_timeout_s = 60
db_host_url = "localhost"
db_name = "ai_omni_server_admin_test_db_0"
migrations_home = "sql/queue/"
user = "aio_core"
pw = "password"

[auth]
asaa_home = "http://localhost:9090/"

[auth.keycloak]
use_server_based_check = true
