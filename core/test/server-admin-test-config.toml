[core]
threads = 6
blocking_threads = 2
log_level = "info"
record_logs = true
log_dir = "target/tmp"
server_port = 8081
server_worker_count = 1
server_max_blocking_threads = 1
operator_idle_timeout_s = 300
vk_redirect_uri = "https://localhost:8081/vk/callback"
fe_dir = "../.test-settings/fe_dir"

[consul]
consul_host = "http://user:password@test.ru:8500"
consul_id = "uzor-aiomni-core-dev"
consul_tags = ["rust", "api", "ai-omni-core"]
current_host = "http://test.ru:8081"

[chat]
apis = ["vk", "telegram"]

[db]
max_connections = 10
min_connections = 2
max_no_log_connections = 2
acquire_timeout_s = 30
max_lifetime_s = 3600
idle_timeout_s = 60
db_host_url = "localhost"
db_name = "ai_omni_server_admin_test_db_0"
migrations_home = "sql/core/"
user = "aio_core"
pw = "password"

[llm.request]
# This is a good lightweight test model
model = "\"agi-0_art-skynet-3b\""
# This model solves the "A и Б сидели на трубе" problem.
# model = "\"llama-3.1-8b-open-sft\""

prompts = [
    "Your role is a call center assistant. You must ALWAYS follow these four rules when answering queries: 1) Answer all incoming request in Russian. 2) Answer all incoming queries politely. 3) Provide the most informative answer that you are capable of. 4) Always provide the confidence interval of your answer.",
]
max_tokens = 10_000
temperature = 0.8

[llm.client]
host = "http://localhost:8088/"
chat_path = "v1/chat/completions"

[queue]
ping_period_s = 30
operator_lifetime_s = 600

[queue.db]
max_connections = 4
min_connections = 1
max_no_log_connections = 1
acquire_timeout_s = 30
max_lifetime_s = 3600
idle_timeout_s = 60
db_host_url = "localhost"
db_name = "ai_omni_server_admin_test_db_0"
migrations_home = "sql/queue/"
user = "aio_core"
pw = "password"

[auth]
# asaa_home = "https://tc-asaa.telecontact.ru"
asaa_home = "http://localhost:9996"

